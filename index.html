<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06070b">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src wss: https:; base-uri 'none'; form-action 'none'">
<title>DEGEN DESK · Command</title>
<style>
:root{
  --bg:#06070b;--bg2:#0b0d14;--card:#0f121b;--card2:#131724;--line:#1d2232;--line2:#272e44;
  --tx:#e9ecf5;--mut:#8a93ab;--dim:#5a6279;
  --ac:#7cf7d4;--ac2:#8b7bff;--warn:#ffcc66;--bad:#ff6b8b;--good:#5cf2a0;--moon:#c9a7ff;
  --sans:"Space Grotesk","Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 80% -10%,rgba(139,123,255,.10),transparent 60%),
  radial-gradient(700px 420px at -10% 10%,rgba(124,247,212,.07),transparent 60%),var(--bg)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hd{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(var(--bg) 70%,rgba(6,7,11,0));}
.logo{font-family:var(--sans);font-weight:700;letter-spacing:.14em;font-size:13px}
.logo b{color:var(--ac)}
.sp{flex:1}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:4px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.pill.paper{color:var(--warn);border-color:rgba(255,204,102,.35)}
.fr{display:flex;align-items:center;gap:6px}
.fr{font-size:11px;font-weight:600;padding:5px 10px;background:rgba(255,255,255,.03)}
.fr i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.fr.live{color:var(--good);border-color:rgba(92,242,160,.35);background:rgba(92,242,160,.07)} .fr.live i{background:var(--good);box-shadow:0 0 8px var(--good);animation:blink 1.6s infinite}
.fr.stale{color:var(--warn);border-color:rgba(255,204,102,.4);background:rgba(255,204,102,.07)} .fr.stale i{background:var(--warn)}
.fr.snap{color:var(--ac2);border-color:rgba(139,123,255,.4);background:rgba(139,123,255,.08)} .fr.snap i{background:var(--ac2)}
.fr.disc{color:var(--bad);border-color:rgba(255,107,139,.4);background:rgba(255,107,139,.08)} .fr.disc i{background:var(--bad)}
@keyframes blink{50%{opacity:.35}}
main{padding:0 14px calc(var(--sab) + 92px)}
.tab{display:none}.tab.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
h2{font-family:var(--sans);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:20px 2px 10px;font-weight:600;display:flex;align-items:center;gap:8px}
h2 small{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--dim);font-weight:400}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.k{font-size:10.5px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.v{font-family:var(--mono);font-size:17px;margin-top:4px;font-variant-numeric:tabular-nums}
.v.s{font-size:14px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.moon{color:var(--moon)}.mut{color:var(--mut)}.dim{color:var(--dim)}
/* ---------- brain ---------- */
.brain{position:relative;overflow:hidden;padding:18px 16px 16px;border-radius:22px;border:1px solid var(--line2);
  background:radial-gradient(420px 260px at 50% 0%,rgba(124,247,212,.09),transparent 70%),linear-gradient(180deg,#0d1019,#0a0c13)}
.brain .row{display:flex;gap:16px;align-items:center}
.orb{position:relative;width:104px;height:104px;flex:none}
.orb .core{position:absolute;inset:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--oc,#7cf7d4) 22%,rgba(0,0,0,.0) 72%);
  box-shadow:0 0 34px var(--oc,#7cf7d4),inset 0 0 18px rgba(255,255,255,.25);animation:pulse var(--op,2.4s) ease-in-out infinite}
.orb .ring{position:absolute;inset:6px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--oc,#7cf7d4) 55%,transparent);animation:spin 14s linear infinite}
.orb .ring2{position:absolute;inset:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--oc,#7cf7d4) 25%,transparent);
  border-top-color:var(--oc,#7cf7d4);animation:spin var(--os,3s) linear infinite}
.orb svg{position:absolute;inset:0}
.orb>div{animation-delay:var(--od,0s)!important}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.04);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.brain.frozen .orb *{animation-play-state:paused!important}
.brain.frozen{filter:grayscale(1) brightness(.75);padding-top:40px}
.brain.frozen::after{content:attr(data-freeze);position:absolute;right:12px;top:12px;font-family:var(--mono);font-size:10px;color:var(--warn);
  border:1px solid rgba(255,204,102,.4);padding:3px 7px;border-radius:8px;filter:none}
.st{font-family:var(--sans);font-weight:700;font-size:24px;letter-spacing:.02em;line-height:1.05}
.stx{color:var(--mut);font-size:12.5px;margin-top:6px;line-height:1.35}
.dec{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:7px;
  background:rgba(255,204,102,.08);color:var(--warn);border:1px solid rgba(255,204,102,.25)}
.dec.ai{background:rgba(124,247,212,.08);color:var(--ac);border-color:rgba(124,247,212,.3)}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.meter{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:8px}
.meter .k{font-size:9px}.meter .v{font-size:14px;margin-top:3px}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.bar>b{display:block;height:100%;background:var(--ac);border-radius:3px}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.35}
.banner.bad{background:rgba(255,107,139,.08);border:1px solid rgba(255,107,139,.3);color:#ffc2cf}
.banner.warn{background:rgba(255,204,102,.07);border:1px solid rgba(255,204,102,.28);color:#ffe3a8}
/* ---------- pipeline ---------- */
.pipe{display:flex;align-items:stretch;gap:0;margin-top:2px}
.pst{flex:1;text-align:center;padding:10px 2px;position:relative}
.pst .n{font-family:var(--mono);font-size:18px}
.pst .l{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.pst+.pst::before{content:"";position:absolute;left:-4px;top:50%;width:8px;height:8px;border-top:1px solid var(--dim);border-right:1px solid var(--dim);transform:translateY(-50%) rotate(45deg)}
.feed{display:flex;flex-direction:column;gap:8px}
.tc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  animation:slide .35s ease}
.tc.old{animation:none}
@keyframes slide{from{opacity:0;transform:translateX(-6px)}to{opacity:1}}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:3px 6px;border-radius:6px;border:1px solid;white-space:nowrap}
.c-rej{color:var(--bad);border-color:rgba(255,107,139,.35);background:rgba(255,107,139,.06)}
.c-ent{color:var(--ac);border-color:rgba(124,247,212,.35);background:rgba(124,247,212,.06)}
.c-tp{color:var(--good);border-color:rgba(92,242,160,.35);background:rgba(92,242,160,.06)}
.c-ex{color:var(--warn);border-color:rgba(255,204,102,.35);background:rgba(255,204,102,.06)}
.c-moon{color:var(--moon);border-color:rgba(201,167,255,.35);background:rgba(201,167,255,.06)}
.c-fill{color:var(--mut);border-color:var(--line2)}
.c-nof{color:var(--bad);border-color:rgba(255,107,139,.5);background:rgba(255,107,139,.12)}
.tsym{font-family:var(--sans);font-weight:700;font-size:15px}
.tmeta{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.45}
.why{font-size:11.5px;color:#b9c0d4;margin-top:5px;line-height:1.35}
.tr{text-align:right;font-family:var(--mono);font-size:11px;color:var(--mut)}
.tr b{display:block;font-size:13px;color:var(--tx);font-weight:500}
/* ---------- positions ---------- */
.pos{padding:13px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:9px;cursor:pointer}
.pos .top{display:flex;align-items:center;gap:8px}
.mult{font-family:var(--mono);font-size:20px;margin-left:auto}
.lock{font-family:var(--mono);font-size:9.5px;color:var(--moon);border:1px solid rgba(201,167,255,.35);padding:2px 6px;border-radius:6px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{width:100%;max-height:86vh;overflow:auto;background:var(--bg2);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line2);
  padding:10px 16px calc(var(--sab) + 18px);animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:2px auto 12px}
.ev{display:grid;grid-template-columns:16px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ev .dot{width:9px;height:9px;border-radius:50%;margin-top:4px}
/* ---------- scanner ---------- */
.cand{padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.checks{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ck{font-family:var(--mono);font-size:9.5px;padding:3px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--mut)}
.ck.ok{color:var(--good);border-color:rgba(92,242,160,.3)} .ck.no{color:var(--bad);border-color:rgba(255,107,139,.3)}
.hbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:12px;margin:7px 0}
.hbar .t{height:6px;background:var(--line);border-radius:6px;overflow:hidden;grid-column:1/3}.hbar .t b{display:block;height:100%;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:500;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
.note{font-size:11px;color:var(--dim);line-height:1.45;margin-top:8px}
/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);padding:8px 6px calc(var(--sab) + 8px);
  background:rgba(8,9,14,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav button{background:none;border:0;color:var(--dim);font-family:var(--body);font-size:9.5px;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button.on{color:var(--ac)}
.empty{padding:26px 14px;text-align:center;color:var(--mut);font-size:13px;border:1px dashed var(--line2);border-radius:14px}
.gate{margin:40px 4px;padding:20px;border-radius:18px;border:1px solid var(--line2);background:var(--card);line-height:1.5}

/* ---------- desk: tablet (760–1199) and desktop (≥1200) command center; the phone layout above is untouched ---------- */
#desk,.dnav,.lsub,.xbtn{display:none}
@media (min-width:760px){
  main,nav{display:none!important}
  #desk{display:block;padding:0 18px 22px}
  .hd{padding:14px 18px 12px;gap:12px;background:rgba(6,7,11,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .logo{font-size:15px}
  .dnav{display:flex;gap:6px;margin-left:10px}
  .dnav button{background:var(--card);border:1px solid var(--line2);color:var(--mut);font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:6px 11px;border-radius:9px;cursor:pointer}
  .dnav button:hover{color:var(--tx);border-color:var(--ac2)}
  .hd .fr{font-size:14px;letter-spacing:.08em;padding:8px 16px 8px 13px;border-radius:12px;gap:9px}
  .hd .fr i{width:10px;height:10px}
  .lsub{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);text-align:right;line-height:1.3;max-width:260px}
  .hstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;margin:12px 0;border:1px solid var(--line);border-radius:14px;background:var(--line);overflow:hidden}
  .hs{padding:8px 12px;min-width:0;background:linear-gradient(180deg,var(--card2),var(--card))}
  .hs .k{font-size:9px;white-space:nowrap}
  .hs .v{font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dgrid{display:grid;gap:14px;grid-template-columns:1fr 1fr;grid-template-areas:"core core" "scan pos" "feed perf"}
  .pn{background:linear-gradient(180deg,rgba(19,23,36,.75),rgba(15,18,27,.75));border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;min-width:0}
  .pn>header{display:flex;align-items:center;gap:8px;padding:12px 14px 0;font-family:var(--sans);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}
  .pn>header small{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--dim);font-weight:400;margin-left:auto}
  .pn>header .dotl{width:6px;height:6px;border-radius:50%;background:var(--ac)}
  .pb{padding:10px 14px 14px;overflow:auto;min-height:0;max-height:72vh;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  .a-core{grid-area:core}.a-scan{grid-area:scan}.a-pos{grid-area:pos}.a-feed{grid-area:feed}.a-perf{grid-area:perf}
  .a-core .pb{max-height:none}
  .pb h2{margin:14px 2px 8px;font-size:10.5px}
  .pb h2:first-child{margin-top:2px}
  .brain.desk .orb{width:132px;height:132px}
  .brain.desk .orb .core{inset:28px}
  .brain.desk .st{font-size:30px}
  .brain.desk .meters{grid-template-columns:repeat(4,1fr)}
  .brain .pipe{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.015)}
  .sheet{align-items:stretch;justify-content:flex-end}
  .sheet .in{width:min(620px,92vw);max-height:none;height:100%;border-radius:22px 0 0 22px;padding:14px 22px 22px;animation:side .22s ease}
  @keyframes side{from{transform:translateX(30px);opacity:.4}}
  .grab{display:none}
  .xbtn{display:block;position:sticky;top:0;float:right;background:var(--card);border:1px solid var(--line2);color:var(--mut);border-radius:9px;padding:5px 10px;font-family:var(--mono);font-size:11px;cursor:pointer;z-index:2}
}
@media (min-width:760px) and (max-width:1199px){.hstrip{grid-template-columns:repeat(6,minmax(0,1fr))}.hs:last-child{grid-column:span 2}}
@media (min-width:1200px) and (min-height:620px){
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  .hd{flex:none;position:relative}
  #desk{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 18px 16px}
  .hstrip{flex:none}
  .dgrid{flex:1;min-height:0;grid-template-columns:minmax(340px,1.1fr) minmax(300px,1fr) minmax(320px,1.05fr);
    grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);grid-template-areas:"core scan pos" "perf scan feed"}
  .pb{max-height:none;flex:1}
  .hstrip{grid-template-columns:repeat(11,minmax(0,1fr))}
}
@media (min-width:1400px) and (min-height:620px){
  .dgrid{grid-template-columns:minmax(360px,1.12fr) minmax(300px,1fr) minmax(300px,1fr) minmax(300px,1fr);
    grid-template-rows:auto minmax(0,1fr);grid-template-areas:"core scan pos feed" "perf scan pos feed"}
  .a-core .pb{flex:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="hd">
  <div class="logo">DEGEN<b>·</b>DESK</div>
  <span class="pill paper">PAPER</span>
  <div class="dnav" id="dnav"><button data-d="history">HISTORY</button><button data-d="performance">PERFORMANCE</button><button data-d="health">HEALTH</button></div>
  <div class="sp"></div>
  <div class="lsub" id="lsub"></div>
  <span id="fresh" class="pill fr disc"><i></i><span>CONNECTING</span></span>
</div>
<main id="main">
  <section class="tab on" id="t-command"></section>
  <section class="tab" id="t-positions"></section>
  <section class="tab" id="t-scanner"></section>
  <section class="tab" id="t-history"></section>
  <section class="tab" id="t-performance"></section>
  <section class="tab" id="t-health"></section>
</main>
<div id="desk">
  <div class="hstrip" id="hstrip"></div>
  <div class="dgrid">
    <section class="pn a-core"><header><span class="dotl"></span>Bot core<small id="h-core"></small></header><div class="pb" id="d-core"></div></section>
    <section class="pn a-scan"><header><span class="dotl" style="background:var(--ac2)"></span>Live scanner<small id="h-scan"></small></header><div class="pb" id="d-scan"></div></section>
    <section class="pn a-pos"><header><span class="dotl" style="background:var(--good)"></span>Open positions<small id="h-pos"></small></header><div class="pb" id="d-pos"></div></section>
    <section class="pn a-feed"><header><span class="dotl" style="background:var(--warn)"></span>Activity feed<small id="h-feed"></small></header><div class="pb" id="d-feed"></div></section>
    <section class="pn a-perf"><header><span class="dotl" style="background:var(--moon)"></span>Performance<small id="h-perf"></small></header><div class="pb" id="d-perf"></div></section>
  </div>
</div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<nav id="nav"></nav>
<script>
"use strict";
/* DEGEN DESK cockpit — static, read-only, no CDN, no build. Data arrives AES-256-GCM-encrypted from public relays;
   the key and relay settings live only in this URL's #fragment, which browsers never send to any server. */
const TABS=[["command","Command",'<circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="9" stroke-dasharray="2 3"/>'],
 ["positions","Positions",'<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 15l3-3 2 2 3-4"/>'],
 ["scanner","Scanner",'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M11 8v3h3"/>'],
 ["history","History",'<path d="M4 12a8 8 0 1 0 2.3-5.7M4 5v4h4M12 8v4l3 2"/>'],
 ["performance","Perf",'<path d="M4 19V5M4 19h16M7 15l4-4 3 3 5-6"/>'],
 ["health","Health",'<path d="M3 12h4l2-5 4 10 2-5h6"/>']];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=1e9, sol=(l,d=4)=>l==null?"—":(l/L).toFixed(d), ssol=(l,d=4)=>l==null?"—":((l>=0?"+":"")+(l/L).toFixed(d));
const cls=v=>v==null?"mut":v>0?"good":v<0?"bad":"mut";
const ago=ms=>{if(ms==null)return"—";const s=Math.max(0,Math.round(ms/1000));return s<60?s+"s":s<3600?Math.floor(s/60)+"m":Math.floor(s/3600)+"h"+String(Math.floor(s%3600/60)).padStart(2,"0")};
const clock=t=>{const d=new Date(t);return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit",timeZone:"America/Mexico_City"})};

/* ---------------- crypto ---------------- */
async function openEnv(text){
  const e=JSON.parse(text); if(e.v!==1) throw Error("bad version");
  const aad=new TextEncoder().encode(`dd1|${e.k}|${e.s}|${e.t}`);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u(e.iv),additionalData:aad},KEY,b64u(e.c));
  const js=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return [e,JSON.parse(js)];
}
async function onMsg(text,via,retained){
  let e,o; try{[e,o]=await openEnv(text)}catch(x){S.err="decrypt/verify failed ("+via+")";return}
  // short-lived Ably viewer token rides inside the encrypted ntfy snapshot; harvested before the replay check, never rendered
  if(o&&o.relay){ const t=o.relay.ably; if(t&&typeof t.t==="string"&&(!S.ablyTok||t.exp>S.ablyTok.exp)){ S.ablyTok=t; setTimeout(ablyStep,0) } delete o.relay; }

  if(S.data && o.gen < S.data.gen) return;
  const now=Date.now(); S.rx[via]=now; S.frames++; S.first=S.first||{}; if(S.first[via]==null) S.first[via]=Math.round(performance.now());
  if(!retained&&via!=="ntfy"){ S.lat=S.lat||{}; (S.lat[via]=S.lat[via]||[]).push(now-e.t); if(S.lat[via].length>50) S.lat[via].shift() }
  if(via==="mqtt"||via==="ably"){ if(retained){S.retRx=now;S.retT=e.t} else S.liveRx=now; }

  else{ const keep=S.data||{}; S.data=Object.assign({},keep,o,{engine:Object.assign({},keep.engine||{},o.engine)}); }
  S.lastFrame=Date.now(); S.lastKind=e.k; S.boxDelay=e.t-o.gen;
  render();
}

/* ---------------- MQTT 3.1.1 over WSS (hand-rolled, QoS0 subscribe) ---------------- */
function mqttStr(s){const b=new TextEncoder().encode(s);return [b.length>>8,b.length&255,...b]}
function mqttPkt(h,body){const len=[];let n=body.length;do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;len.push(d)}while(n>0);return new Uint8Array([h,...len,...body])}
function mqtt(){
  if(!F.mq||!F.mt) return;
  let ws,buf=new Uint8Array(0),ping,retry=1000;
  const go=()=>{
    S.tx.mqtt="connecting"; render();
    if(S.paused) return;
    try{ws=new WebSocket(F.mq,["mqtt"]);S.ws=ws}catch(x){S.tx.mqtt="error";return setTimeout(go,retry=Math.min(retry*2,30000))}
    ws.binaryType="arraybuffer";
    ws.onopen=()=>{
      const flags=0x02|(F.mu?0x80:0)|(F.mp?0x40:0);
      const body=[...mqttStr("MQTT"),4,flags,0,30,...mqttStr("ddc"+Math.random().toString(16).slice(2,10)),...(F.mu?mqttStr(F.mu):[]),...(F.mp?mqttStr(F.mp):[])];
      ws.send(mqttPkt(0x10,body));
    };
    ws.onmessage=ev=>{
      const a=new Uint8Array(ev.data),nb=new Uint8Array(buf.length+a.length);nb.set(buf);nb.set(a,buf.length);buf=nb;
      for(;;){ // one WS frame can carry several MQTT packets (e.g. SUBACK + retained PUBLISH)
        if(buf.length<2)break; let i=1,m=1,n=0,d;
        do{if(i>=buf.length)return;d=buf[i++];n+=(d&127)*m;m*=128}while(d&128);
        if(buf.length<i+n)break; const p=buf.slice(0,i+n); buf=buf.slice(i+n); const t=p[0]>>4;
        if(t===2){ if(p[i+1]!==0){S.tx.mqtt="refused";render();return}
          ws.send(mqttPkt(0x82,[0,1,...mqttStr(F.mt+"/full"),0,...mqttStr(F.mt+"/live"),0]));
          S.tx.mqtt="connected";retry=1000;clearInterval(ping);ping=setInterval(()=>{try{ws.send(new Uint8Array([0xc0,0]))}catch(x){}},20000);render();}
        else if(t===3){ const qos=(p[0]>>1)&3; const tl=(p[i]<<8)|p[i+1]; let j=i+2+tl; if(qos)j+=2;
          onMsg(new TextDecoder().decode(p.slice(j)),"mqtt",!!(p[0]&1)); }
      }
    };
    ws.onclose=()=>{clearInterval(ping);S.tx.mqtt="reconnecting";render();setTimeout(go,retry=Math.min(retry*2,30000))};
    ws.onerror=()=>{try{ws.close()}catch(x){}};
  };
  go();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ws&&ws.readyState>1)go()});
}
/* ---------------- Ably SSE (optional push relay; only if the fragment carries ak + ac) ----------------
   Subscribe-only key, EventSource (no SDK, no CDN). rewind=1 replays the last message on (re)connect: that first
   message is a cached copy, so it is flagged "retained" and judged by its envelope age, never as a live push. */
/*ABLY-BEGIN*/
// Pure decision for the Ably link. cur = token the open connection uses (null if none), best = freshest token held,
// err = Ably error code from the stream (0 if none). Token errors are 40140..40149 (Ably SSE docs).
const ABLY_RENEW_MS=5*60000;
function tokOk(now,t){ return !!t && typeof t.t==="string" && t.exp-now>60000 }
function ablyDecide(now,cur,best,err){
  const tokErr=err>=40140&&err<40150;
  if(tokErr&&best&&cur&&best.t===cur.t) return {act:"fetch",why:"token rejected"};        // need a newer one first
  if(!tokOk(now,best)) return {act:"fetch",why:best?"token expired":"no token yet"};
  if(!cur||err||(best.t!==cur.t&&cur.exp-now<ABLY_RENEW_MS)) return {act:"connect",tok:best};
  if(cur.exp-now<ABLY_RENEW_MS) return {act:"fetch",why:"renewing before expiry"};
  return {act:"keep"};
}
/*ABLY-END*/
/* ---------------- Ably SSE with short-lived token auth (no API key in the page, link or repo) ----------------
   publisherd mints a ≤60-min, subscribe-only JWT for one channel and ships it inside the encrypted ntfy snapshot.
   The page decrypts it, connects with accessToken=…, and swaps to a newer token before expiry. rewind=1 replays the
   last message on connect: that first message is a cached copy → flagged "retained" and judged by its envelope age. */
const AB={cur:null,es:null,err:0,fetching:0};
function ablyClose(){ try{AB.es&&AB.es.close()}catch(x){} AB.es=null; AB.cur=null }
async function ntfyLatest(){
  if(!F.nb||!F.nt||Date.now()-AB.fetching<30000) return; AB.fetching=Date.now();
  try{ const r=await fetch(F.nb.replace(/\/$/,"")+"/"+F.nt+"/json?poll=1&since=2h",{cache:"no-store"});
       const m=(await r.text()).trim().split("\n").filter(Boolean).map(l=>JSON.parse(l)).filter(m=>m.event==="message");
       if(m.length) await onMsg(m[m.length-1].message,"ntfy"); }catch(x){}
}
function ablyStep(){
  if(S.paused||!S.ablyTok) return;           // Ably stays off until the box publishes a token (i.e. until it is enabled)
  const now=Date.now(), d=ablyDecide(now,AB.cur,S.ablyTok,AB.err);
  if(d.act==="fetch"){ if(AB.es&&!tokOk(now,AB.cur)) ablyClose(); if(!AB.es) S.tx.ably=d.why; ntfyLatest(); render(); return }
  if(d.act!=="connect") return;
  ablyClose(); AB.err=0; S.tx.ably="connecting"; let first=true;
  const t=d.tok, ch=t.c, host=(t.h||"https://main.realtime.ably.net").replace(/\/$/,"");
  let es; try{ es=new EventSource(host+"/event-stream?v=1.2&rewind=1&channels="+encodeURIComponent(ch)+"&accessToken="+encodeURIComponent(t.t)) }
  catch(x){ S.tx.ably="error"; return }
  AB.es=es; AB.cur=t; S.esA=es;
  es.onopen=()=>{S.tx.ably="connected";render()};
  es.onmessage=ev=>{ try{ const m=JSON.parse(ev.data); if(typeof m.data==="string"){ onMsg(m.data,"ably",first); first=false } }catch(x){} };
  es.onerror=ev=>{ let code=0; try{ code=JSON.parse(ev.data).code||0 }catch(x){}
    S.tx.ably="reconnecting"; render();
    if(code||es.readyState===2){ AB.err=code||1; es.close(); if(AB.es===es){AB.es=null} setTimeout(ablyStep,code>=40140&&code<40150?0:5000) } };
}
function ably(){ setInterval(ablyStep,15000) }
/* ---------------- ntfy (encrypted ~6-min snapshots; NOT live) ---------------- */
async function ntfy(){
  if(!F.nb||!F.nt) return; const base=F.nb.replace(/\/$/,"")+"/"+F.nt;
  try{ S.tx.ntfy="polling";
    const r=await fetch(base+"/json?poll=1&since=12h",{cache:"no-store"}); const lines=(await r.text()).trim().split("\n").filter(Boolean);
    const msgs=lines.map(l=>JSON.parse(l)).filter(m=>m.event==="message");
    if(msgs.length) await onMsg(msgs[msgs.length-1].message,"ntfy");
    S.tx.ntfy="subscribed";
  }catch(x){S.tx.ntfy="error"}
  try{ const es=new EventSource(base+"/sse"); S.es=es; es.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==="message")onMsg(m.message,"ntfy")}catch(x){}};
       es.onerror=()=>{S.tx.ntfy="retrying"}; es.onopen=()=>{S.tx.ntfy="subscribed"} }catch(x){}
  render();
}
/* ---------------- freshness: LIVE only if a push frame arrived recently ---------------- */
/*FRESH-BEGIN*/
// Pure classifier (unit-tested from tests/test_cockpit.py via node). Inputs are receipt times (this device's clock) and
// envelope times (box clock). A non-retained MQTT frame is a genuine push → judged by receipt time (skew-free). A retained
// MQTT frame (or an Ably rewind replay) is a cached copy → judged by its envelope age. ntfy frames are periodic snapshots and can never be LIVE.
const LIVE_MS=15000, SNAP_MAX_MS=15*60000, ENGINE_MAX_MS=15000;
function classify(now,x){
  const ago_=ms=>{if(ms==null)return"—";const s=Math.max(0,Math.round(ms/1000));return s<60?s+"s":s<3600?Math.floor(s/60)+"m":Math.floor(s/3600)+"h"+String(Math.floor(s%3600/60)).padStart(2,"0")};
  const conn=x.mqtt==="connected"||x.ably==="connected", ntfyUp=x.ntfy==="subscribed"||x.ntfy==="polling";
  if(!x.hasData) return {c:"disc",t:(conn||ntfyUp)?"WAITING":"CONNECTING",live:false,age:null,why:"no data received yet"};
  const env=(t,rx)=>t==null?rx:Math.min(t,rx);                       // never trust an envelope time in this device's future
  const age=now-env(x.lastT,x.lastRx);                                // age of the newest data shown
  const push=x.liveRx!=null?now-x.liveRx:null;
  const ret=x.retRx!=null?now-env(x.retT,x.retRx):null;
  const mqFresh=conn&&((push!=null&&push<=LIVE_MS)||(ret!=null&&ret<=LIVE_MS));
  const eng=x.boxDelay!=null&&x.boxDelay>ENGINE_MAX_MS;               // box-clock only: publish time − engine state time
  if(mqFresh&&!eng){const a=push!=null&&push<=LIVE_MS?push:ret;return {c:"live",t:"LIVE · "+ago_(a),live:true,age:a,why:"encrypted push frame "+ago_(a)+" ago"}}
  if(mqFresh&&eng) return {c:"stale",t:"STALE · engine "+ago_(x.boxDelay),live:false,age:x.boxDelay,why:"relay is live but the engine state is not updating"};
  if(!conn&&!ntfyUp) return {c:"disc",t:"DISCONNECTED · "+ago_(age),live:false,age,why:"no relay connected; showing data "+ago_(age)+" old"};
  if(x.src==="ntfy"&&age<=SNAP_MAX_MS) return {c:"snap",t:"SNAPSHOT · "+ago_(age)+" old",live:false,age,why:"no live push; periodic encrypted snapshot (~6 min cadence)"};
  return {c:"stale",t:"STALE · "+ago_(age),live:false,age,why:"no push frame in the last 15 s"};
}
/*FRESH-END*/
function freshness(){
  return classify(Date.now(),{hasData:!!S.data,mqtt:S.tx.mqtt,ably:S.tx.ably,ntfy:S.tx.ntfy,liveRx:S.liveRx,retRx:S.retRx,retT:S.retT,
    src:S.src,lastT:S.lastT,lastRx:S.lastRx,boxDelay:S.boxDelay});
}

function syms(d){const m={};for(const x of [...(d.trades||[]),...(d.positions||[]),...(d.engine?.cands||[]),...(d.moonbags||[])])if(x.mint&&(x.sym))m[x.mint]=x.sym;

function decLabel(d){return d.is_ai?`<span class="dec ai">◆ GROK AI</span>`:`<span class="dec">◇ MOCK · rule-based · not Grok AI</span>`}
function stageOf(a){

function spark(pts,{w=340,h=90,base=null,markers=[],color="#7cf7d4",fmt=v=>v}={}){

}

   <h2>Why not promoted now <small>first failing check</small></h2><div class="card">${bars(e.notpromo,"var(--ac2)")}</div>
   <h2>Why rejected <small>last 24 h · all policies</small></h2><div class="card">${bars(e.rej,"var(--bad)")}
   <div class="note">“daily loss limit hit” rejections are from mock-v1/v2. mock-v3 has no loss stop; breaches are flags only.</div></div>`);
  const agentN=(d.positions||[]).filter(p=>p.agent_tok>0).length;
  $("#h-pos").textContent=agentN+" agent · "+(d.moonbags||[]).length+" moonbag";
  setPanel("d-pos",posSummary(d)+posLists(d));
  $("#h-feed").textContent=acts.length+" newest · executable values";
  setPanel("d-feed",`<div class="feed">${acts.length?acts.map(a=>card(a,m)).join(""):`<div class="empty">No decisions yet. Idle means idle.</div>`}</div>`);
  $("#h-perf").textContent=(d.policy||"")+" · paper";
  setPanel("d-perf",tPerf(d));
  if(S.drawer) setPanel("sheetIn",drawerHTML(S.drawer,d,fr));
}
function drawerHTML(t,d,fr){
  const fn={history:tHistory,performance:tPerf,health:tHealth}[t];
  return `<button class="xbtn" onclick="closeSheet()">CLOSE ✕</button><h2 style="margin-top:6px">${esc(t)}</h2>`+fn(d,fr);
}
window.closeSheet=()=>{S.drawer=null;$("#sheet").classList.remove("on")};
window.__drawer=t=>{if(!S.data)return;S.drawer=t;$("#sheetIn").innerHTML=drawerHTML(t,S.data,freshness());$("#sheet").classList.add("on");$("#sheetIn").scrollTop=0};
$("#dnav").onclick=e=>{const b=e.target.closest("button");if(b)__drawer(b.dataset.d)};
/* ---------------- render ---------------- */
function badge(fr){const fe=$("#fresh"); fe.className="pill fr "+fr.c; fe.lastElementChild.textContent=fr.t; fe.title=fr.why||"";
  $("#lsub").textContent=fr.why||""; document.title=(fr.live?"● ":"○ ")+fr.t.split(" · ")[0]+" · DEGEN DESK"}
function render(){
  const fr=freshness(); badge(fr);
  if(DESK.matches) return renderDesk(fr);
  const d=S.data;
  if(!d){ $("#t-"+S.tab).innerHTML=`<div class="gate">${KEY?`<b>Connecting to the encrypted relay…</b><div class="note">MQTT: ${esc(S.tx.mqtt)} · ntfy: ${esc(S.tx.ntfy)}</div>`:
     `<b>No key in this link.</b><div class="note">Open the full cockpit link (with its #fragment). The fragment holds the decryption key and relay topics and is never sent to the host.</div>`}</div>`; return }
  const fn={command:tCommand,positions:tPositions,scanner:tScanner,history:tHistory,performance:tPerf,health:tHealth}[S.tab];
  const el=$("#t-"+S.tab), y=window.scrollY; el.innerHTML=fn(d,fr); window.scrollTo(0,y); S.seen=S.seenMax;
}
window.__tab=t=>{S.tab=t;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.id==="t-"+t));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));window.scrollTo(0,0);render()};
$("#nav").innerHTML=TABS.map(([k,l,ic])=>`<button data-t="${k}" class="${k==="command"?"on":""}"><svg viewBox="0 0 24 24">${ic}</svg>${l}</button>`).join("");
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)__tab(b.dataset.t)};
window.__pause=()=>{S.paused=true;try{S.es&&S.es.close()}catch(x){};S.tx.ntfy="closed";try{S.ws&&S.ws.close()}catch(x){};ablyClose();S.tx.ably=S.ablyTok?"closed":"off"};
window.__state=()=>({fresh:freshness(),tx:S.tx,frames:S.frames,hasFull:!!S.full,err:S.err,gen:S.data?.gen,layout:DESK.matches?(innerWidth>=1200?"desktop":"tablet"):"phone",src:S.src,first:S.first||{},lat:S.lat||{},tokMin:S.ablyTok?Math.round((S.ablyTok.exp-Date.now())/60000):null});
DESK.addEventListener?.("change",()=>{ if(!DESK.matches&&S.drawer) closeSheet(); render() });
(async()=>{
  if(F.k){ try{KEY=await crypto.subtle.importKey("raw",b64u(F.k),"AES-GCM",false,["decrypt"])}catch(x){S.err="bad key"} }
  render(); if(KEY){ mqtt(); ably(); ntfy(); }
  setInterval(()=>{const fr=freshness(); badge(fr);
    if(DESK.matches) $("#hstrip").innerHTML=hstrip(S.data,fr);
    document.querySelectorAll(".brain").forEach(br=>{br.classList.toggle("frozen",!fr.live);br.dataset.freeze=fr.live?"":"FROZEN · "+fr.t})},1000);
})();
</script>
</body>
</html>
